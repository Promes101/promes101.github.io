<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pessoas</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#050a06">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pessoas">
<style>
    :root {
        --fundo: #050a06;
        --cartao: rgba(7, 20, 12, .90);
        --borda: rgba(0, 255, 102, .22);
        --texto: #d8ffe4;
        --fraco: #7fae8d;
        --principal: #00e676;
        --principal-texto: #04120a;
        --secundario: #16241a;
        --secundario-texto: #bdf7cf;
        --perigo: #ff4b3e;
        --perigo-fundo: rgba(255, 75, 62, .14);
    }
    * { box-sizing: border-box; }
    body {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        margin: 0;
        padding: 16px;
        background: var(--fundo);
        color: var(--texto);
        min-height: 100vh;
    }
    #fundo-matriz {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
        pointer-events: none;
    }
    body > *:not(#fundo-matriz) {
        position: relative;
        z-index: 1;
    }
    h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
    .topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
    }
    .contador { font-size: 12px; color: var(--fraco); }
    .botao-matriz {
        width: auto;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 999px;
        border: 1px solid var(--borda);
        background: rgba(0, 255, 102, .10);
        color: var(--principal);
        cursor: pointer;
    }
    .botao-matriz[aria-pressed="false"] {
        background: rgba(255, 255, 255, .05);
        color: var(--fraco);
        border-color: rgba(255, 255, 255, .12);
    }
    .cartao {
        background: var(--cartao);
        border: 1px solid var(--borda);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    }
    .cartao h2 {
        font-size: 14px;
        margin: 0 0 12px;
        color: var(--principal);
        letter-spacing: .06em;
        text-transform: uppercase;
    }
    label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--fraco); }
    input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        font-family: inherit;
        border: 1px solid var(--borda);
        border-radius: 8px;
        margin-bottom: 12px;
        background: rgba(0, 0, 0, .45);
        color: var(--texto);
    }
    input::placeholder { color: #4f7a5c; }
    input:focus { outline: 1px solid var(--principal); outline-offset: 0; }
    button {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-family: inherit;
        border: 0;
        border-radius: 8px;
        background: var(--principal);
        color: var(--principal-texto);
        font-weight: 700;
        cursor: pointer;
        letter-spacing: .02em;
    }
    button:active { background: #00b85e; }
    button.perigo { background: var(--perigo); color: #fff; }
    button.perigo:active { background: #c9382e; }
    button.secundario {
        background: var(--secundario);
        color: var(--secundario-texto);
        border: 1px solid var(--borda);
        font-weight: 600;
    }
    button.secundario:active { background: #1f3326; }
    .linha-botoes { display: flex; gap: 8px; }
    .linha-botoes button { flex: 1; }
    .busca { display: flex; gap: 8px; }
    .busca input { margin: 0; }
    .busca button { width: auto; padding: 10px 16px; }
    .aviso {
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 13px;
        display: none;
        border: 1px solid transparent;
    }
    .aviso.visivel { display: block; }
    .aviso.ok {
        background: rgba(0, 230, 118, .12);
        color: #7dffb0;
        border-color: rgba(0, 230, 118, .35);
    }
    .aviso.erro {
        background: var(--perigo-fundo);
        color: #ff9d94;
        border-color: rgba(255, 75, 62, .4);
    }
    ul.lista { list-style: none; margin: 0; padding: 0; }
    ul.lista li {
        background: var(--cartao);
        border: 1px solid var(--borda);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 8px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .dados { flex: 1; min-width: 0; }
    .nome { font-weight: 600; word-break: break-word; }
    .detalhe { font-size: 12px; color: var(--fraco); margin-top: 2px; }
    .acoes { display: flex; gap: 6px; flex-shrink: 0; }
    .mini {
        display: inline-block;
        padding: 7px 11px;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
        text-decoration: none;
        background: rgba(0, 255, 102, .10);
        color: #a8ffc8;
        border: 1px solid rgba(0, 255, 102, .28);
        width: auto;
        cursor: pointer;
        font-weight: 500;
    }
    .mini.perigo {
        background: var(--perigo-fundo);
        color: #ff9d94;
        border-color: rgba(255, 75, 62, .35);
    }
    .vazio {
        text-align: center;
        color: var(--fraco);
        padding: 28px 12px;
        background: var(--cartao);
        border: 1px dashed var(--borda);
        border-radius: 12px;
    }
    .rodape { font-size: 11px; color: #4f7a5c; text-align: center; margin-top: 8px; }
    .oculto { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
        #fundo-matriz { display: none; }
    }
</style>
</head>
<body>

<canvas id="fundo-matriz" aria-hidden="true"></canvas>

<div class="topo">
    <h1>Pessoas</h1>
    <div style="display:flex;align-items:center;gap:10px">
        <span class="contador" id="contador"></span>
        <button type="button" class="botao-matriz" id="botao-matriz" aria-pressed="true">MATRIX</button>
    </div>
</div>

<div class="aviso" id="aviso"></div>

<div class="cartao" id="cartao-form">
    <h2 id="titulo-form">Adicionar pessoa</h2>
    <form id="form">
        <input type="hidden" id="campo-id">
        <label for="campo-nome">Nome</label>
        <input id="campo-nome" type="text" maxlength="80" required autocomplete="off">
        <label for="campo-idade">Idade</label>
        <input id="campo-idade" type="number" min="0" max="130" required>
        <div class="linha-botoes">
            <button type="submit" id="botao-guardar">Adicionar</button>
            <button type="button" class="secundario oculto" id="botao-cancelar">Cancelar</button>
        </div>
    </form>
</div>

<div class="cartao">
    <h2>Pesquisar</h2>
    <div class="busca">
        <input id="campo-busca" type="search" placeholder="Parte do nome" autocomplete="off">
        <button type="button" class="secundario" id="botao-limpar">Limpar</button>
    </div>
</div>

<ul class="lista" id="lista"></ul>

<div class="cartao">
    <h2>Cópia de segurança</h2>
    <div class="linha-botoes">
        <button type="button" class="secundario" id="botao-exportar">Exportar</button>
        <button type="button" class="secundario" id="botao-importar">Importar</button>
    </div>
    <input type="file" id="campo-ficheiro" accept=".json,application/json" class="oculto">
</div>

<p class="rodape">Os dados ficam guardados neste navegador.</p>

<script src="./app.js"></script>
</body>
</html>
