<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pessoas</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#050506">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pessoas">
<style>
    :root {
        --fundo: #050506;
        --cartao: rgba(13, 11, 12, .90);
        --borda: rgba(255, 45, 45, .26);
        --texto: #f3eaea;
        --fraco: #9c8383;
        --principal: #ff2b2b;
        --principal-escuro: #b30f0f;
        --principal-texto: #0b0404;
        --ciano: #35e0ff;
        --secundario: #191214;
        --secundario-texto: #ffd9d9;
        --perigo: #ff4d4d;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        margin: 0;
        padding: 16px;
        background: var(--fundo);
        color: var(--texto);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* --- camadas de fundo (chuva, scanlines, vinheta) --- */
    #fundo-matriz {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
        pointer-events: none;
    }
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, .28) 0 1px,
            transparent 1px 3px
        );
        opacity: .55;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(
            ellipse at center,
            transparent 52%,
            rgba(0, 0, 0, .62) 100%
        );
    }
    body > *:not(#fundo-matriz) {
        position: relative;
        z-index: 1;
    }

    /* --- cabecalho com glitch --- */
    h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: .16em;
        text-transform: uppercase;
        position: relative;
        color: var(--texto);
    }
    h1::before,
    h1::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
    }
    h1::before {
        color: var(--principal);
        animation: glitch-a 6.5s infinite steps(1);
    }
    h1::after {
        color: var(--ciano);
        animation: glitch-b 6.5s infinite steps(1);
    }
    @keyframes glitch-a {
        0%, 91% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); }
        92% { opacity: .85; transform: translate(-3px, -1px); clip-path: inset(10% 0 55% 0); }
        94% { opacity: .85; transform: translate(2px, 1px); clip-path: inset(60% 0 12% 0); }
        96% { opacity: .6; transform: translate(-2px, 0); clip-path: inset(35% 0 40% 0); }
        97%, 100% { opacity: 0; }
    }
    @keyframes glitch-b {
        0%, 91% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); }
        93% { opacity: .7; transform: translate(3px, 1px); clip-path: inset(45% 0 25% 0); }
        95% { opacity: .7; transform: translate(-3px, -1px); clip-path: inset(5% 0 70% 0); }
        97%, 100% { opacity: 0; }
    }

    .topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
    }
    .contador { font-size: 12px; color: var(--fraco); }
    .botao-matriz {
        width: auto;
        padding: 7px 11px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        border-radius: 999px;
        border: 1px solid var(--borda);
        background: rgba(255, 43, 43, .10);
        color: var(--principal);
    }
    .botao-matriz[aria-pressed="false"] {
        background: rgba(255, 255, 255, .04);
        color: var(--fraco);
        border-color: rgba(255, 255, 255, .12);
    }

    /* --- cartoes --- */
    .cartao {
        background: var(--cartao);
        border: 1px solid var(--borda);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, .55), inset 0 0 22px rgba(255, 43, 43, .035);
    }
    .cartao h2 {
        font-size: 13px;
        margin: 0 0 12px;
        color: var(--principal);
        letter-spacing: .14em;
        text-transform: uppercase;
    }
    .cartao h2::before { content: "> "; opacity: .65; }
    label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--fraco); letter-spacing: .04em; }
    input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        font-family: inherit;
        border: 1px solid var(--borda);
        border-radius: 8px;
        margin-bottom: 12px;
        background: rgba(0, 0, 0, .55);
        color: var(--texto);
        caret-color: var(--principal);
    }
    input::placeholder { color: #6d5555; }
    input:focus {
        outline: 1px solid rgba(255, 43, 43, .75);
        box-shadow: 0 0 14px rgba(255, 43, 43, .22);
    }

    /* --- botoes com animacao de toque --- */
    button {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-family: inherit;
        border: 0;
        border-radius: 8px;
        background: var(--principal);
        color: var(--principal-texto);
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform .09s ease, box-shadow .2s ease, background-color .2s ease;
        box-shadow: 0 0 0 0 rgba(255, 43, 43, 0);
    }
    button:hover { box-shadow: 0 0 0 1px rgba(255, 43, 43, .45), 0 0 20px rgba(255, 43, 43, .30); }
    button:active {
        transform: scale(.955);
        background: var(--principal-escuro);
        box-shadow: 0 0 0 1px rgba(255, 43, 43, .6), 0 0 26px rgba(255, 43, 43, .45);
    }
    button.secundario {
        background: var(--secundario);
        color: var(--secundario-texto);
        border: 1px solid rgba(255, 43, 43, .22);
        font-weight: 600;
    }
    button.secundario:active { background: #241417; }

    /* botao de apagar: so contorno (diferente do principal) */
    button.perigo,
    .mini.perigo {
        background: transparent;
        color: #ff8f8f;
        border: 1px solid rgba(255, 70, 70, .55);
        box-shadow: none;
        text-shadow: 0 0 8px rgba(255, 43, 43, .45);
    }
    button.perigo:active,
    .mini.perigo:active {
        background: rgba(255, 43, 43, .18);
        transform: scale(.955);
    }

    .linha-botoes { display: flex; gap: 8px; }
    .linha-botoes button { flex: 1; }
    .busca { display: flex; gap: 8px; }
    .busca input { margin: 0; }
    .busca button { width: auto; padding: 10px 16px; }

    /* --- avisos --- */
    .aviso {
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 13px;
        display: none;
        border: 1px solid transparent;
    }
    .aviso.visivel { display: block; animation: aparecer .18s ease-out; }
    .aviso.ok {
        background: rgba(255, 43, 43, .10);
        color: #ffb3b3;
        border-color: rgba(255, 43, 43, .40);
    }
    .aviso.erro {
        background: rgba(255, 43, 43, .20);
        color: #ffd0d0;
        border-color: rgba(255, 43, 43, .75);
    }
    @keyframes aparecer {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: none; }
    }

    /* --- lista --- */
    ul.lista { list-style: none; margin: 0; padding: 0; }
    ul.lista li {
        background: var(--cartao);
        border: 1px solid var(--borda);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 8px;
        box-shadow: 0 10px 22px rgba(0, 0, 0, .5);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .dados { flex: 1; min-width: 0; }
    .nome { font-weight: 600; word-break: break-word; letter-spacing: .02em; }
    .detalhe { font-size: 11px; color: var(--fraco); margin-top: 3px; letter-spacing: .04em; }
    .acoes { display: flex; gap: 6px; flex-shrink: 0; }
    .mini {
        position: relative;
        overflow: hidden;
        display: inline-block;
        padding: 7px 11px;
        border-radius: 6px;
        font-size: 11px;
        font-family: inherit;
        letter-spacing: .06em;
        text-transform: uppercase;
        text-decoration: none;
        background: rgba(255, 43, 43, .10);
        color: #ffbdbd;
        border: 1px solid rgba(255, 43, 43, .30);
        width: auto;
        cursor: pointer;
        font-weight: 600;
        transition: transform .09s ease, box-shadow .2s ease, background-color .2s ease;
    }
    .mini:active { transform: scale(.94); }
    .mini:hover { box-shadow: 0 0 12px rgba(255, 43, 43, .35); }

    .vazio {
        text-align: center;
        color: var(--fraco);
        padding: 28px 12px;
        background: var(--cartao);
        border: 1px dashed var(--borda);
        border-radius: 12px;
        font-size: 13px;
    }

    .rodape {
        font-size: 11px;
        color: #7d5f5f;
        text-align: center;
        margin-top: 8px;
        letter-spacing: .04em;
    }
    .cursor {
        display: inline-block;
        color: var(--principal);
        animation: piscar 1.1s steps(2, start) infinite;
    }
    @keyframes piscar { 50% { opacity: 0; } }

    .oculto { display: none !important; }

    /* --- efeito de toque (ripple) --- */
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, .55);
        transform: translate(-50%, -50%) scale(0);
        animation: ondular .55s ease-out forwards;
        pointer-events: none;
        z-index: -1;
    }
    @keyframes ondular {
        to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        #fundo-matriz { display: none; }
        h1::before, h1::after, .cursor, .ripple { animation: none !important; }
        .aviso.visivel { animation: none; }
        button, .mini { transition: none; }
    }
</style>
</head>
<body>

<canvas id="fundo-matriz" aria-hidden="true"></canvas>

<div class="topo">
    <h1 data-text="PESSOAS">PESSOAS</h1>
    <div style="display:flex;align-items:center;gap:10px">
        <span class="contador" id="contador"></span>
        <button type="button" class="botao-matriz" id="botao-matriz" aria-pressed="true">MATRIX</button>
    </div>
</div>

<div class="aviso" id="aviso"></div>

<div class="cartao" id="cartao-form">
    <h2 id="titulo-form">Adicionar pessoa</h2>
    <form id="form">
        <input type="hidden" id="campo-id">
        <label for="campo-nome">Nome</label>
        <input id="campo-nome" type="text" maxlength="80" required autocomplete="off">
        <label for="campo-idade">Idade</label>
        <input id="campo-idade" type="number" min="0" max="130" required>
        <div class="linha-botoes">
            <button type="submit" id="botao-guardar">Adicionar</button>
            <button type="button" class="secundario oculto" id="botao-cancelar">Cancelar</button>
        </div>
    </form>
</div>

<div class="cartao">
    <h2>Pesquisar</h2>
    <div class="busca">
        <input id="campo-busca" type="search" placeholder="Parte do nome" autocomplete="off">
        <button type="button" class="secundario" id="botao-limpar">Limpar</button>
    </div>
</div>

<ul class="lista" id="lista"></ul>

<div class="cartao">
    <h2>Cópia de segurança</h2>
    <div class="linha-botoes">
        <button type="button" class="secundario" id="botao-exportar">Exportar</button>
        <button type="button" class="secundario" id="botao-importar">Importar</button>
    </div>
    <input type="file" id="campo-ficheiro" accept=".json,application/json" class="oculto">
</div>

<p class="rodape">[ sistema online · dados neste navegador ]<span class="cursor">▍</span></p>

<script src="./app.js"></script>
</body>
</html>
